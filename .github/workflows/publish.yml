name: Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMG_DIR: public/img
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache compiler binary
        id: compiler
        uses: actions/cache@v6
        with:
          path: compiler/bin/haskellBook
          key: haskellBook-${{ runner.os }}-${{ hashFiles('compiler/app/**/*.hs', 'compiler/*.cabal') }}

      - name: Install Haskell
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: '3.10.2.1'

      - name: Build compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          mkdir -p compiler/bin
          cd compiler
          cabal v2-install exe:haskellBook --installdir="$(pwd)/bin" --install-method=copy --overwrite-policy=always

      - name: Cache optimized SVGs
        id: svgs
        uses: actions/cache@v6
        with:
          path: ${{ env.IMG_DIR }}
          key: svgs-${{ runner.os }}-${{ hashFiles('book/illustrations/**') }}

      - name: Install Inkscape
        if: steps.svgs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape

      - name: Install SVGO
        if: steps.svgs.outputs.cache-hit != 'true'
        run: npm install -g svgo

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          cache-dependency-path: book/typst/prologue.typ

      - name: Install Source Code Pro
        if: steps.svgs.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.local/share/fonts
          gh release download --repo adobe-fonts/source-code-pro --pattern "OTF-*.zip" --dir /tmp
          unzip -o -j /tmp/OTF-*.zip "*.otf" -d ~/.local/share/fonts
          fc-cache -f

      - name: Process illustrations
        if: steps.svgs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$IMG_DIR"
          for file in book/illustrations/*; do
              if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  echo "Processing file: $filename"
                  inkscape --file="$file" --export-text-to-path -o "$IMG_DIR"/"$filename"
                  svgo -i "$IMG_DIR"/"$filename" --final-newline --multipass
              fi
          done

      - name: Compile book
        run: ./compiler/bin/haskellBook book/ public/

      - name: Compile PDF
        run: |
          mkdir -p typst-out
          ./compiler/bin/haskellBook --typst book/ typst-out/
          cp -a "$IMG_DIR" typst-out/img
          typst compile --root typst-out typst-out/book.typ public/programiranje_u_haskelu-nikola_ubavic.pdf

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Prepare SSH
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          sudo chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $SSH_PORT -H new.ubavic.rs >> ~/.ssh/known_hosts

      - name: Transfer via rsync
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.USER }}
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            public/ "$USER@new.ubavic.rs:/var/www/haskel.ubavic.rs/"